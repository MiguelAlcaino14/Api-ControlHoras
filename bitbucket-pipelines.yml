image: docker:20.10.24

pipelines:
  branches:
    master:
      - step:
          services:
            - docker
          script:
            # reconstruir key desde base64
            - printf "%s" "$SSH_KEY_BASE64" | base64 -d > key
            - chmod 600 key

            # build imagen
            - docker build --build-arg VITE_API_URL="$VITE_API_URL" -t siroe/$APP_NAME:latest .

            # empaquetar imagen
            - docker save siroe/$APP_NAME:latest | gzip > image.tar.gz

            # asegurar carpeta en server
            - ssh -o StrictHostKeyChecking=no -i key root@$SERVER "mkdir -p /root/apps/$APP_NAME"

            # copiar imagen
            - scp -o StrictHostKeyChecking=no -i key image.tar.gz root@$SERVER:/root/apps/$APP_NAME/

            # deploy remoto
            - |
              ssh -o StrictHostKeyChecking=no -i key root@$SERVER << EOF
              set -e

              cd /root/apps/$APP_NAME

              printf "%s" "$ENV_FILE_BASE64" | base64 -d > .env

              docker load < image.tar.gz

              cat > docker-compose.yml <<EOC
              version: "3.8"

              services:
                api:
                  image: siroe/$APP_NAME:latest
                  container_name: $APP_NAME
                  restart: always
                  env_file:
                    - .env
                  networks:
                    - traefik_default
                  labels:
                    - "traefik.enable=true"
                    - "traefik.http.routers.$APP_NAME.rule=Host(\"$APP_HOST\")"
                    - "traefik.http.routers.$APP_NAME.entrypoints=web"
                    - "traefik.http.services.$APP_NAME.loadbalancer.server.port=$APP_PORT"
                    - "traefik.docker.network=traefik_default"
              networks:
                traefik_default:
                  external: true
              EOC

              docker-compose down --remove-orphans || true
              docker-compose up -d

              EOF